; WonderScope - web dashboard for the Waveshare ESP32-S3-RS485-CAN(-U)
;
; Board: ESP32-S3R8 (8 MB octal PSRAM), W25Q128 16 MB quad flash.
; Pins (from Waveshare demo + schematic):
;   RS485  UART1  TX=17  RX=18  DE/RE=21 (SP3485, isolated)
;   CAN    TWAI   TX=15  RX=16             (TJA1051, isolated, S tied low)
;   RTC    I2C    SDA=39 SCL=38  INT=40     (PCF85063)

[platformio]
default_envs = wonderscope

[env:wonderscope]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
    -DWS_MAX_QUEUED_MESSAGES=64

lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.0
    bblanchon/ArduinoJson @ 7.4.3

extra_scripts = pre:tools/embed_web.py
